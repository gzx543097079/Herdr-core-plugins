<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Herdr · 插件管理</title>
<style>
:root{color-scheme:light;--bg:#f6f7f8;--ink:#202329;--muted:#616773;--line:#e1e4e8;--accent:#315fde}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:940px;margin:64px auto;padding:0 28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}.brand{display:flex;gap:12px;align-items:center}.brand svg{width:34px;height:34px}h1{font-size:24px;letter-spacing:-.6px;margin:0}header p{margin:3px 0 0;color:var(--muted)}button{font:inherit;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);padding:7px 14px;cursor:pointer;transition:background 140ms,opacity 140ms}button:hover{background:#edf0f7}button:focus-visible{outline:3px solid #9ab2fa;outline-offset:3px}button:disabled{opacity:.5;cursor:wait}.statusbar{padding:12px 16px;border:1px solid var(--line);border-radius:9px;background:white;display:flex;gap:9px;align-items:center;margin-bottom:16px}.dot{width:7px;height:7px;background:#858b96;border-radius:50%}.dot.online{background:#28805b}#layout{margin-left:auto;color:var(--muted);font-size:12px}.plugins{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.plugin{padding:25px 24px;display:grid;grid-template-columns:40px 1fr auto;gap:16px;align-items:center}.plugin+.plugin{border-top:1px solid var(--line)}.icon{width:36px;height:36px;display:grid;place-items:center;background:#f0f3f9;border-radius:9px;color:#526482}.icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}h2{font-size:15px;margin:0;display:flex;align-items:center;gap:12px}p{margin:4px 0 0;color:var(--muted)}.badge{font-size:11px;font-weight:400;color:#626974;background:#f1f2f4;border-radius:5px;padding:2px 7px}.badge.on{background:#eaf5ee;color:#246744}.actions{display:flex;gap:8px}.primary{background:var(--accent);border-color:var(--accent);color:white}.primary:hover{background:#274fc3}.remove{color:#795451}#notice{min-height:30px;padding:12px 0;color:#286447}#notice.error{color:#ac3434}footer{color:var(--muted);font-size:12px;margin:18px 0}details{border-top:1px solid var(--line);padding-top:15px;color:var(--muted)}summary{cursor:pointer}pre{white-space:pre-wrap;font:12px/1.6 ui-monospace,monospace;max-height:280px;overflow:auto;background:white;padding:14px;border-radius:8px} @media(max-width:650px){main{margin:28px auto;padding:0 18px}header{align-items:flex-start}.plugin{grid-template-columns:36px 1fr;padding:20px 16px}.actions{grid-column:2;justify-content:flex-start}#layout{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><main><header><div class="brand"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="26" height="24" rx="6"/><path d="M21 4v24M9 11v10M15 11v10M9 16h6"/></svg><div><h1>Herdr 插件管理</h1><p>为你的工作区，开启刚刚好的增强。</p></div></div><button id="refresh">刷新状态</button></header>
<div class="statusbar"><span class="dot" id="dot"></span><span id="connection">正在连接 Herdr…</span><span id="layout"></span></div><section class="plugins" id="plugins" aria-label="可用插件"></section>
<div id="notice" role="status" aria-live="polite"></div><footer>所有操作仅在本机执行。卸载对话历史插件不会删除 Claude / Codex 的对话记录。<br>卸载会从当前布局撤销插件；保留模块副本，方便再次注入。</footer><details><summary>操作日志</summary><pre id="log">尚未执行操作</pre></details></main>
<script>
const token='__TOKEN__';
const entries=[{id:'history',name:'对话历史',description:'Claude / Codex 分组、连续滚动、双击恢复。与文件和改动面板互斥。',icon:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/>'},{id:'motion',name:'桌面动效',description:'轻量原生过渡，按需绘制文件列表，减少等待和重复刷新。',icon:'<path d="M3 16h4l4-10 4 14 3-8h3"/>'},{id:'language',name:'简体中文',description:'为桌面端工作区、标签栏和菜单注入中文界面。',icon:'<path d="M3 5h12M9 3v2M6 5c0 6 4 9 8 11M13 5c0 6-4 9-10 12M14 21l4-11 4 11M16 17h4"/>'},{id:'commands',name:'命令提示',description:'在底部显示当前 CLI 的常用命令与 Skill。',icon:'<path d="M4 5l6 7-6 7M12 19h8"/>'},{id:'git',name:'Git 工作台',description:'查看提交树、文件差异和 PR。',icon:'<path d="M6 3v12M6 15a3 3 0 1 0 0 6 3 3 0 0 0 0-6M18 3v4a5 5 0 0 1-5 5H6"/>'}];
let busy=false,state={plugins:{}};
const $=id=>document.getElementById(id);
function draw(){ $('dot').classList.toggle('online',!!state.running);$('connection').textContent=state.running?'Herdr 已连接':'Herdr 未连接，请先打开桌面端';$('layout').textContent=state.layout||'';
 $('plugins').innerHTML=entries.map(p=>`<article class="plugin"><div class="icon"><svg viewBox="0 0 24 24">${p.icon}</svg></div><div><h2>${p.name}<span class="badge ${state.plugins[p.id]?'on':''}">${state.plugins[p.id]?'已启用':'未启用'}</span></h2><p>${p.description}</p></div><div class="actions"><button class="remove" data-id="${p.id}" data-action="uninstall" ${busy||!state.running||state.managed===false||!state.plugins[p.id]?'disabled':''}>卸载</button><button class="primary" data-id="${p.id}" data-action="install" ${busy||!state.running||state.managed===false?'disabled':''}>${state.plugins[p.id]?'重新注入':'注入插件'}</button></div></article>`).join('');$('refresh').disabled=busy;
}
async function refresh(){try{const r=await fetch('/api/status');state=await r.json();draw()}catch(e){$('connection').textContent='管理服务已停止，请重新打开启动文件'}}
$('refresh').onclick=refresh;
$('plugins').onclick=async e=>{const b=e.target.closest('button[data-id]');if(!b||busy)return;busy=true;draw();$('notice').className='';$('notice').textContent='正在'+(b.dataset.action==='install'?'注入':'卸载')+'，请稍候…';
 try{const r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json','X-Plugin-Token':token},body:JSON.stringify({plugin:b.dataset.id,action:b.dataset.action})});const d=await r.json();if(!r.ok)throw Error(d.error);$('notice').textContent=d.message;$('log').textContent=d.log||d.message;}catch(e){$('notice').className='error';$('notice').textContent=e.message;$('log').textContent=e.message;}finally{busy=false;await refresh()}};
refresh();
</script></html>
